# CI variables required (Settings → CI/CD → Variables):
#   VPS_HOST, VPS_SSH_USER, VPS_SSH_KEY (File, Masked)
#   REGISTRY_USER, REGISTRY_PASSWORD (Masked)
#   DB_PASSWORD (Masked), JWT_SECRET (Masked)
#   POSTGRES_DB, POSTGRES_USER

stages:
  - test-backend
  - test-frontend
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository

cache:
  paths:
    - .m2/repository/
    - frontend/node_modules/

backend-test:
  stage: test-backend
  image: maven:3.9.7-eclipse-temurin-21
  script:
    - cd backend/localadvisor
    - ./mvnw verify
  artifacts:
    reports:
      junit: backend/localadvisor/target/surefire-reports/TEST-*.xml

frontend-test:
  stage: test-frontend
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --progress=false --ignore-scripts
  script:
    - npm run type-check
    - npm run test:unit

build-images:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build
      -f docker/Dockerfile.backend
      -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
      -t $CI_REGISTRY_IMAGE/backend:latest
      backend/localadvisor
    - docker build
      -f docker/Dockerfile.frontend
      -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
      -t $CI_REGISTRY_IMAGE/frontend:latest
      frontend
    - docker push $CI_REGISTRY_IMAGE/backend --all-tags
    - docker push $CI_REGISTRY_IMAGE/frontend --all-tags
  needs:
    - backend-test
    - frontend-test

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - chmod +x deploy/deploy.sh
    - ./deploy/deploy.sh
  environment:
    name: production
    url: http://$VPS_HOST:4173
  needs:
    - build-images
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
